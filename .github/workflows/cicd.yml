name: 8byte CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: project-2-cicd/app
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: project-2-cicd/app
        run: python -m pytest -v

      - name: Build Docker image
        working-directory: project-2-cicd/app
        run: docker build -t 8byte-flask-app .